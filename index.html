<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Arena</title>
<style>
:root{--bg:#fff7ef;--fg:#2a1a10;--card:#fff;--line:#e6cdb8;--accent:#d9480f;--mute:#7a5c48;--hp:#2f9e44;--foe:#7048e8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1410;--fg:#f6e8dc;--card:#2a1f18;--line:#4a372a;--accent:#ff8c42;--mute:#b89a85;--hp:#51cf66;--foe:#9775fa;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;margin:6px 0 12px}
button{font:inherit;padding:12px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fighter{text-align:center}
.dragon{font-size:64px;line-height:1;transition:transform .15s}
.hit{transform:translateX(8px) rotate(6deg)}
.shield{filter:drop-shadow(0 0 10px var(--foe))}
.name{font-weight:700;margin:6px 0}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hp);width:100%;transition:width .2s}
.foe .bar>i{background:var(--foe)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.log{font-size:14px;color:var(--mute);min-height:60px;margin:0;padding-left:18px}
.banner{text-align:center;font-weight:800;font-size:22px;margin:8px 0}
.note{font-size:14px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>🐉 Dragon Arena</h1>
  <p class="sub">Two dragons, one arena. Both players type the same room code.</p>

  <div id="lobby" class="card">
    <label>Your dragon’s name<input id="nick" maxlength="16" placeholder="e.g. Ember"></label>
    <label>Room code<input id="code" maxlength="20" placeholder="e.g. arena1"></label>
    <button id="join">Enter arena</button>
    <p class="note" id="status"></p>
  </div>

  <div id="game" hidden>
    <div class="card">
      <div class="row">
        <div class="fighter"><div class="dragon" id="meD">🐉</div><div class="name" id="meN"></div><div class="bar"><i id="meH"></i></div><div class="note" id="meT"></div></div>
        <div class="fighter foe"><div class="dragon" id="foeD">🐲</div><div class="name" id="foeN">Waiting for opponent…</div><div class="bar"><i id="foeH" style="width:0"></i></div><div class="note" id="foeT"></div></div>
      </div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="actions">
      <button id="fire">🔥 Fire (14)</button>
      <button id="claw">🗡️ Claw (6)</button>
      <button id="guard">🛡️ Guard</button>
    </div>
    <div class="card" style="margin-top:12px">
      <ul class="log" id="log"></ul>
      <button id="again" hidden style="margin-top:8px">Rematch</button>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var peer=null,conn=null,myName="",hp=100,guard=false,cd={fire:0,claw:0,guard:0};
  var foe=null; // {name,hp,guard}
  var nickEl=$("nick"),codeEl=$("code"),st=$("status");
  try{nickEl.value=localStorage.getItem("da_nick")||"";codeEl.value=localStorage.getItem("da_code")||""}catch(e){}

  function log(t){var li=document.createElement("li");li.textContent=t;var l=$("log");l.insertBefore(li,l.firstChild);while(l.children.length>5)l.removeChild(l.lastChild)}
  function over(){return hp<=0||(foe&&foe.hp<=0)}
  function render(){
    $("meN").textContent=(myName||"You")+" (you)";
    $("meH").style.width=Math.max(0,hp)+"%";$("meT").textContent=hp+" HP";
    $("meD").className="dragon"+(guard?" shield":"");
    var ban=$("banner");
    if(foe){
      $("foeN").textContent=foe.name;$("foeH").style.width=Math.max(0,foe.hp)+"%";$("foeT").textContent=foe.hp+" HP";
      $("foeD").className="dragon"+(foe.guard?" shield":"");
      ban.textContent=hp<=0?"💀 You were defeated":(foe.hp<=0?"🏆 You win!":"");
    }else{$("foeN").textContent="Waiting for opponent…";$("foeH").style.width="0";$("foeT").textContent="";ban.textContent=""}
    $("again").hidden=!over();
    var live=!!foe&&!over();
    $("fire").disabled=!live;$("claw").disabled=!live;$("guard").disabled=!live;
  }
  function send(o){if(conn&&conn.open)conn.send(o)}
  function sync(){send({t:"state",hp:hp,guard:guard})}
  function ready(k,ms){var n=Date.now();if(n<cd[k])return false;cd[k]=n+ms;return true}
  function attack(k,dmg,ms,label){
    if(!foe||over()||!ready(k,ms))return;
    send({t:"hit",dmg:dmg});log("You used "+label+" for "+dmg);
    var d=$("meD");d.classList.add("hit");setTimeout(function(){d.classList.remove("hit")},150);
  }
  function wire(c){
    conn=c;
    c.on("open",function(){send({t:"hello",name:myName});sync()});
    c.on("data",function(m){
      if(!m||typeof m!=="object")return;
      if(m.t==="hello"){foe={name:String(m.name||"Opponent").slice(0,16),hp:100,guard:false};log(foe.name+" entered the arena");sync();render()}
      else if(m.t==="state"&&foe){var h=Number(m.hp);foe.hp=isNaN(h)?100:Math.min(100,h);foe.guard=!!m.guard;render()}
      else if(m.t==="hit"&&hp>0){
        var d=Math.min(30,Math.max(0,Number(m.dmg)||0));if(guard)d=Math.ceil(d/2);
        hp=Math.max(0,hp-d);log((foe?foe.name:"Foe")+" hit you for "+d+(guard?" (guarded)":""));sync();render();
      }
    });
    c.on("close",function(){foe=null;conn=null;log("Opponent left");render()});
  }
  function enter(){
    $("lobby").hidden=true;$("game").hidden=false;render();
  }
  function start(code){
    var id="dragonarena-v1-"+code;
    peer=new Peer(id);
    peer.on("open",function(){enter();log("Room created. Waiting for your friend…")});
    peer.on("connection",function(c){if(conn&&conn.open){c.close();return}wire(c)});
    peer.on("error",function(e){
      if(e.type==="unavailable-id"){
        peer.destroy();peer=new Peer();
        peer.on("open",function(){var c=peer.connect(id,{reliable:true});wire(c);enter();log("Joining room…")});
        peer.on("error",function(){st.textContent="Could not join. Check the room code and try again."});
      }else{st.textContent="Connection problem ("+e.type+"). Try again."}
    });
  }
  $("join").onclick=function(){
    var nick=nickEl.value.trim(),code=codeEl.value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
    if(!nick||!code){st.textContent="Enter a name and a room code.";return}
    try{localStorage.setItem("da_nick",nick);localStorage.setItem("da_code",code)}catch(e){}
    myName=nick;st.textContent="Connecting…";start(code);
  };
  $("fire").onclick=function(){attack("fire",14,1200,"Fire")};
  $("claw").onclick=function(){attack("claw",6,500,"Claw")};
  $("guard").onclick=function(){
    if(over()||!ready("guard",3000))return;
    guard=true;sync();render();log("You raised your wings");
    setTimeout(function(){guard=false;sync();render()},1000);
  };
  $("again").onclick=function(){hp=100;guard=false;sync();log("Ready for a rematch");render()};
  render();
})();
</script>
</body>
</html>
